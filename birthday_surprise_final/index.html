<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7d2348">
  <title>For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="ambient" aria-hidden="true">
      <div class="aurora aurora-a"></div><div class="aurora aurora-b"></div>
      <div id="particles"></div>
      <div id="hearts"></div>
    </div>

    <header class="topbar">
      <button id="musicBtn" class="icon-btn" aria-label="Music controls">♫</button>
      <div id="sceneCounter" class="scene-counter"></div>
    </header>

    <main id="stage" class="stage"></main>

    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <audio id="bgMusic" loop preload="none"></audio>
  </div>
  <script src="script.js"></script>
</body>
</html>
